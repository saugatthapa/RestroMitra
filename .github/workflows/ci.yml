name: CI

# Phase 2 (P1) — runs the exact same verification commands used by hand
# throughout this project's hardening passes (lint, typecheck, test,
# build) on every push/PR to main, against a real Postgres service
# container so the DB-backed integration tests in src/db/__tests__/ run
# for real instead of skipping themselves.
#
# All values below are CI-only dummy values, not production credentials —
# .env.local (the real values) is gitignored and never reaches this repo,
# and production's real VAPID/AUTH_SECRET/DATABASE_URL values live only in
# Hostinger's own environment configuration — never here. AUTH_SECRET just
# needs to be a non-empty, well-formed string (not a real secret in any
# meaningful sense) for session-signing code paths to run, so it stays a
# plain literal below.
#
# The VAPID keypair is different: even though it's never used to sign a
# push message that reaches a real subscriber (push.ts's ensureConfigured()
# just needs it well-formed so the push-branch-filtering integration test
# can exercise the real send path, mocked at the network layer — see
# P1_PHASE_REPORT.md), it IS a real, structurally valid private key, and
# committing one in plaintext — however inert — is exactly the kind of
# thing secret scanners flag and audits rightly call out. It now lives in
# this repo's Actions secrets (Settings -> Secrets and variables -> Actions
# -> New repository secret) instead of here:
#   CI_VAPID_PUBLIC_KEY / CI_VAPID_PRIVATE_KEY — any keypair works, CI never
#   sends a real push notification with it. Generate a fresh one with
#   `node -e "console.log(require('web-push').generateVAPIDKeys())"` and
#   paste the two halves in. Until both secrets are set, `verify` will fail
#   at the Test step (push.ts's ensureConfigured() throws when the keys are
#   empty) — that's a deliberate fail-closed default, not a bug: this
#   workflow no longer has anything push-key-shaped to leak by omission.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: this workflow only ever needs to read the repo
# (checkout) — it doesn't open PRs, write statuses, or push tags. Explicit
# `contents: read` here means a compromised/typo'd action anywhere in this
# file gets the narrowest possible default GITHUB_TOKEN, instead of
# whatever broader default the repo/org settings happen to have.
permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restromitra_ci
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/restromitra_ci
  AUTH_SECRET: ci-dummy-secret-not-used-in-production-1234567890
  # Must match the origin the gateway-callback integration tests hardcode
  # into their request URLs (src/app/api/payments/gateway/[gateway]/
  # callback/route.test.ts) — the callback route builds its redirect
  # Location header from APP_URL, and those tests assert the exact
  # resulting URL including port.
  APP_URL: http://localhost:3100
  VAPID_PUBLIC_KEY: ${{ secrets.CI_VAPID_PUBLIC_KEY }}
  VAPID_PRIVATE_KEY: ${{ secrets.CI_VAPID_PRIVATE_KEY }}
  VAPID_SUBJECT: mailto:ci@example.com

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restromitra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Apply migrations
        run: npm run db:migrate

      # Required on a fresh database — role_permissions (which role gets
      # which permission) is deliberately fixed, non-tenant reference data
      # seeded separately from the schema migrations (see src/db/seed.ts's
      # own doc comment), not baked into a migration. Discovered by actually
      # running this workflow's commands against a genuinely empty database
      # while building it: every permission-check integration test failed
      # without this step, because a migrated-but-unseeded DB has no
      # role -> permission rows at all yet.
      - name: Seed reference data (permissions, role_permissions)
        run: npm run db:seed

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

      # Phase 2 (P1) — E2E tests (Playwright) for the highest-value flows:
      # owner login, QR customer order placement, staff order management,
      # the reservation flow. Runs after Build (not before) and against
      # `next start` (see playwright.config.ts's own comment for why —
      # dev mode was flaky under this suite's concurrent request load) —
      # every spec seeds its own owner/restaurant via direct DB inserts, so
      # it also needs to run after the seed step above, reading real
      # role_permissions data through the same RBAC checks a production
      # request would hit.
      #
      # Runs `npx playwright test` directly, not `npm run test:e2e` —
      # that script also runs `next build` itself (so a local one-command
      # `npm run test:e2e` always has something to start), which would
      # just redo the Build step above for no reason here.
      #
      # `npx playwright install --with-deps chromium` downloads its own
      # browser here — this differs from the sandbox this workflow was
      # authored in, which has no network access for that and instead
      # points at a pre-baked Chromium via PLAYWRIGHT_CHROMIUM_EXECUTABLE
      # (see playwright.config.ts); on a normal GitHub-hosted runner that
      # path doesn't exist, so the config falls through to Playwright's
      # own browser resolution, i.e. exactly what this step installs.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx playwright test

  # QA hardening (P2 backlog) — "no CI-gated production deploy (manual
  # SSH/Hostinger deploy decoupled from CI green status — a process/
  # runbook decision, not a code fix)". This job is that gate: `needs:
  # verify` means it only starts once lint/typecheck/test/build/e2e have
  # ALL passed, and the `if:` below further restricts it to real pushes to
  # main, on this repository specifically (never a PR, never a fork, never
  # a failed verify run).
  #
  # OFF BY DEFAULT — see CI_GATED_DEPLOY_SETUP.md for what to configure.
  # `vars.DEPLOY_ENABLED` is a plain repository Variable (Settings ->
  # Secrets and variables -> Actions -> Variables), not a Secret, checked
  # here specifically so it's readable in this `if:` condition. Until it's
  # set to the literal string "true", this job is skipped entirely on
  # every run — merging this workflow change is a zero-risk no-op; nothing
  # attempts to reach any server until a human deliberately flips this on
  # AFTER configuring the SSH secrets below and reading that setup doc
  # (in particular, confirming the restart command actually matches how
  # THIS account's Hostinger app is run — that varies by hosting plan and
  # isn't something this workflow can know on its own).
  #
  # `github.repository == 'saugatthapa/RestroMitra'` is defense-in-depth
  # against a fork: `pull_request` events never reach this job anyway (the
  # `github.event_name == 'push'` check already excludes them, and a fork's
  # own `pull_request` runs get a read-only token with none of this repo's
  # secrets regardless), but a fork that pushes to its own `main` runs its
  # own copy of this workflow file with the fork owner's own secrets/vars —
  # this line just makes explicit that THIS deploy job, in THIS repository,
  # never fires for anything other than a push to this repository's main.
  #
  # `environment: production` (below) opts this job into GitHub's
  # Environment protection rules. It works with zero configuration (an
  # environment named "production" is auto-created on first use, with no
  # rules, so this is a no-op until configured) — but once a human adds a
  # "required reviewers" rule to that environment (Settings -> Environments
  # -> production -> Deployment protection rules), every run of this job
  # pauses for a manual approval click before it touches the server, on
  # top of `DEPLOY_ENABLED`. See CI_GATED_DEPLOY_SETUP.md step 6.
  #
  # `concurrency` serializes deploy runs: two pushes to main close together
  # would otherwise start two independent `git reset --hard` + `npm ci` +
  # `npm run build` + restart sequences against the SAME server checkout at
  # the same time, which is a real way to corrupt a deploy (half of one
  # build's files, half of another's). `cancel-in-progress: false` means a
  # second run queues behind the first and still deploys the newer commit
  # after it — it does not cancel a deploy that's already underway.
  deploy:
    name: Deploy to Hostinger
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'saugatthapa/RestroMitra' &&
      vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HOSTINGER_SSH_PORT }}" -H "${{ secrets.HOSTINGER_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          DEPLOY_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
        run: |
          # Mirrors DEPLOY_PHASE25.md's documented manual steps exactly
          # (git pull, npm install, db:migrate, build, restart) — this
          # automates that same sequence, it doesn't invent a new one.
          # `git reset --hard` (not `pull`) deliberately assumes the
          # server's checkout is never hand-edited — exactly the
          # assumption the existing manual runbook already makes.
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            DEPLOY_PATH="$DEPLOY_PATH" bash -s <<'REMOTE_SCRIPT'
            set -euo pipefail
            cd "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run db:migrate
            npm run build
            # CONFIRM THIS matches your actual Hostinger setup before
            # enabling DEPLOY_ENABLED — see CI_GATED_DEPLOY_SETUP.md.
            # Passenger-based Node.js hosting (Hostinger's default)
            # restarts on this file's mtime changing; if your account
            # uses a different process manager, replace this line with
            # its restart command instead.
            mkdir -p tmp && touch tmp/restart.txt
          REMOTE_SCRIPT
