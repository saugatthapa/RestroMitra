# Pins the build config in the repo instead of relying only on whatever's
# set in the Netlify UI, so a fresh site connected to this repo (or a
# teammate's site) gets identical settings without reconfiguring by hand.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Pinned to a version verified locally rather than letting Netlify pick
  # its own default/latest (it was defaulting to Node 24.19.0).
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
